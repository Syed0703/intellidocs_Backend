spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/intellidocs_test}
spring.datasource.username=${TEST_DB_USERNAME:intellidocs_test_user}
spring.datasource.password=${TEST_DB_PASSWORD:intellidocs_test_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${TEST_JWT_SECRET:intellidocs-test-secret-key-at-least-32-characters}

spring.ai.google.genai.api-key=${TEST_GEMINI_API_KEY:test-key}
spring.ai.google.genai.embedding.api-key=${TEST_GEMINI_API_KEY:test-key}

app.frontend-url=http://localhost:5173
app.cookie.secure=false
app.cookie.same-site=Strict